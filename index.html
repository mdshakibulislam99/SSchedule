<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SSchedule - Smart Schedule & Productivity Optimizer</title>
    <meta name="description" content="An AI-powered time management app that analyzes daily schedules, prioritizes tasks with deadlines, generates subtasks, alerts in real-time, and optimizes productivity with Puter.js and multi-model AI." />
    <meta property="og:title" content="SSchedule - Smart Schedule & Productivity Optimizer" />
    <meta property="og:description" content="An AI-powered time management app that analyzes daily schedules, prioritizes tasks with deadlines, generates subtasks, alerts in real-time, and optimizes productivity with Puter.js and multi-model AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
    <!-- Puter.js SDK for Puter AI integration -->
    <script src="https://js.puter.com/v2/"></script>
    <!-- Google Identity Services for Google Calendar sync -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('studyai_theme');
          var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}

        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans select-none overflow-x-hidden">
    <div id="root"></div>
    <script>
      // Global error trap. React's <ErrorBoundary> only catches errors thrown
      // during render — it CANNOT catch failures that happen at module-load
      // time (before createRoot().render() runs). On native WebViews that class
      // of crash leaves a blank white screen, so we surface it here.
      (function () {
        var shown = false;
        function show(label, detail) {
          if (shown) return;
          shown = true;
          try {
            var msg = label + ': ' + (detail && (detail.message || detail)) + '\n\n' +
              (detail && detail.stack ? detail.stack : '(no stack)');
            console.error(msg);
            var pre = document.createElement('pre');
            pre.setAttribute('data-global-error', '1');
            pre.style.cssText =
              'position:fixed;inset:0;z-index:99999;margin:0;padding:16px;overflow:auto;' +
              'background:#7f1d1d;color:#fff;font:12px/1.5 monospace;white-space:pre-wrap;' +
              'text-align:left;';
            pre.textContent = msg;
            (document.body || document.documentElement).appendChild(pre);
          } catch (e) {}
        }
        window.addEventListener('error', function (e) {
          show('window.onerror', e.error || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('unhandledrejection', e.reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
